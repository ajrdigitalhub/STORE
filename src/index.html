body, html {

  padding: 0;

  background-color: #09334f;
  position: relative;
}

#yetiSVG {
  width: 600px;
  height: 470px;
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
}

#lightSVG {
  width: 600px;
  height: 470px;
  position: absolute;
  top: 0;
  left: 0;
  overflow: visible;
}

.content {
  position: fixed;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  font-family: "Source Sans Pro", sans-serif;
  color: #FFF;
  text-align: center;
  width: 90%;
  max-width: 600px;
}
.content h3 {
  margin: 0 0 0.8rem;
  font-size: 2.625rem;
  font-weight: 900;
  line-height: 120%;
}
.content p {
  font-size: 1.25rem;
  font-weight: normal;
  line-height: 150%;
  color: #d1e2ed;
}
.content p span {
  text-decoration: line-through;
}
.content a {
  color: #67B1E0;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
  cursor: pointer;
}
.content a:hover {
  color: #FFF;
  text-decoration: underline;
}

.logo-container {
  position: fixed;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
}

.logo {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: transparent;
  object-fit: cover;
  filter: drop-shadow(0 0 20px rgba(103, 177, 224, 0.3));
  transition: transform 0.3s ease;
}

.logo:hover {
  transform: scale(1.05);
}
</style>
