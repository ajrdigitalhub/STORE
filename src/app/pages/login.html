<div class="min-h-screen flex items-center justify-center px-4 py-2 sm:py-4 bg-metallic-black relative overflow-hidden">
  <!-- Background ambient glow -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-green-900/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>

  <div class="glass-card w-full max-w-md p-5 sm:p-6 relative z-10 border-t border-l border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.8)] backdrop-blur-xl transform transition-all duration-500 hover:shadow-[0_0_40px_rgba(74,222,128,0.15)]">
    
    <!-- Idea Zone 3D Glowing Logo -->
    <div class="relative w-20 h-20 mx-auto mb-4 group" style="perspective: 1000px;">
      <!-- Glowing aura -->
      <div class="absolute inset-0 bg-green-500/20 blur-xl rounded-full animate-pulse group-hover:bg-green-400/40 transition-all duration-700"></div>
      
      <!-- 3D Container -->
      <div class="w-full h-full relative transition-transform duration-700 ease-out transform-gpu group-hover:rotate-y-12 group-hover:-rotate-x-12" style="transform-style: preserve-3d;">
        <!-- Front Face -->
        <div class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-cyan-600/10 backdrop-blur-md rounded-2xl border border-green-400/30 flex items-center justify-center shadow-[0_0_30px_rgba(74,222,128,0.2)]" style="transform: translateZ(20px);">
          <div class="text-center transform transition-transform duration-500 group-hover:scale-110">
            <span class="block text-2xl font-serif italic text-white tracking-tighter" style="text-shadow: 0 0 8px #4ade80, 0 0 16px #22c55e, 0 0 24px #16a34a;">IDEA</span>
            <span class="block text-[10px] font-mono text-green-100 tracking-[0.3em] mt-0.5" style="text-shadow: 0 0 6px #4ade80, 0 0 12px #22c55e;">ZONE</span>
            <span class="absolute -right-3 -top-2 text-[9px] font-black text-white" style="text-shadow: 0 0 6px #4ade80, 0 0 12px #22c55e;">3D</span>
          </div>
        </div>
        <!-- Depth layers -->
        <div class="absolute inset-0 bg-green-900/20 rounded-2xl border border-green-800/30" style="transform: translateZ(10px);"></div>
        <div class="absolute inset-0 bg-black/50 rounded-2xl border border-white/5" style="transform: translateZ(0px);"></div>
      </div>
    </div>

    <h1 class="text-xl font-display font-bold mb-1 text-center bg-clip-text text-transparent bg-gradient-to-r from-white to-accent-muted">Welcome Back</h1>
    <p class="text-accent-muted mb-4 text-center text-xs font-light">
      Enter the <span class="text-green-400 font-medium">Idea Zone</span> to manage your 3D prints.
    </p>

    @if (errorMessage()) {
      <div class="mb-3 p-2 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center">
        {{ errorMessage() }}
      </div>
    }

    <form (submit)="handleSubmit()" class="space-y-3 mb-4">
      <div class="space-y-1 group">
        <label for="email" class="tech-label text-[10px] group-focus-within:text-green-400 transition-colors">Email Address</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-sm group-focus-within:text-green-400 transition-colors">email</span>
          <input id="email" type="email" [(ngModel)]="email" name="email" class="input-field text-sm pl-10 bg-black/40 border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 transition-all" placeholder="name@example.com" required>
        </div>
      </div>
      <div class="space-y-1 group">
        <label for="password" class="tech-label text-[10px] group-focus-within:text-green-400 transition-colors">Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-sm group-focus-within:text-green-400 transition-colors">lock</span>
          <input 
            id="password" 
            [type]="showPassword() ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            class="input-field text-sm pl-10 pr-12 bg-black/40 border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 transition-all" 
            placeholder="••••••••" 
            required
          >
          <button 
            type="button" 
            (click)="showPassword.set(!showPassword())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-accent-muted hover:text-green-400 transition-colors focus:outline-none"
          >
            <span class="material-icons text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>
      
      <button type="submit" [disabled]="isLoading()" class="w-full py-2 mt-3 bg-gradient-to-r from-green-600 to-cyan-600 hover:from-green-500 hover:to-cyan-500 text-white font-semibold rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(74,222,128,0.3)] hover:shadow-[0_0_25px_rgba(74,222,128,0.5)] flex items-center justify-center gap-2">
        @if (isLoading()) {
          <span class="animate-spin material-icons text-sm">refresh</span>
          Authenticating...
        } @else {
          Initialize Session
          <span class="material-icons text-sm">arrow_forward</span>
        }
      </button>
    </form>

    <div class="relative mb-4">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
      <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span class="bg-metallic-gray/50 px-4 text-accent-muted backdrop-blur-md rounded-full">Or connect via</span></div>
    </div>

    <button (click)="loginWithGoogle()" [disabled]="isLoading()" class="w-full py-2 rounded-xl border border-white/10 bg-black/40 hover:bg-white/10 hover:border-white/20 transition-all duration-300 flex items-center justify-center gap-3 text-sm group">
      <img src="https://www.google.com/favicon.ico" class="w-4 h-4 group-hover:scale-110 transition-transform" alt="Google">
      Google Authorization
    </button>
    
    <p class="text-center mt-4 text-xs text-accent-muted">
      New to Idea Zone?
      <a routerLink="/register" class="text-green-400 hover:text-green-300 hover:underline font-bold ml-1 transition-colors">Create Account</a>
    </p>

    <div class="mt-4 pt-3 border-t border-white/10 text-center">
      <div class="bg-green-900/10 rounded-xl p-2 mb-3 border border-green-500/20 hover:border-green-500/40 transition-colors">
        <p class="text-[10px] uppercase tracking-widest text-green-400 mb-1 flex items-center justify-center gap-1">
          <span class="material-icons text-[12px]">admin_panel_settings</span>
          Admin Access
        </p>
        <p class="text-[10px] text-accent-muted">Email: <span class="text-white font-mono bg-black/50 px-2 py-0.5 rounded">admin@ideazone.com</span></p>
        <p class="text-[10px] text-accent-muted mt-1">Pass: <span class="text-white font-mono bg-black/50 px-2 py-0.5 rounded">admin123</span></p>
      </div>
      <a routerLink="/" class="text-[10px] uppercase tracking-widest text-accent-muted hover:text-green-400 transition-colors flex items-center justify-center gap-1">
        Continue as Guest
        <span class="material-icons text-[12px]">arrow_right_alt</span>
      </a>
    </div>
  </div>
</div>
