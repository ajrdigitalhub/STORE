<div class="min-h-screen flex items-center justify-center px-4 py-2 bg-metallic-black relative overflow-hidden">
  <!-- Background ambient glow -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-green-900/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-3xl animate-pulse"
    style="animation-delay: 2s;"></div>

  <div
    class="glass-card w-full max-w-md p-4 sm:p-5 relative z-10 border-t border-l border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.8)] backdrop-blur-xl transform transition-all duration-500 hover:shadow-[0_0_40px_rgba(74,222,128,0.15)]">

    <!-- Simple Logo -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-white tracking-tighter uppercase">IDEAZONE 3D</h2>
    </div>

    <h1
      class="text-lg font-display font-bold mb-1 text-center bg-clip-text text-transparent bg-gradient-to-r from-white to-accent-muted">
      Welcome Back</h1>
    <p class="text-accent-muted mb-6 text-center text-[10px] font-light">
      Enter your credentials to access your account.
    </p>

    @if (errorMessage()) {
    <div class="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] text-center flex items-center justify-center gap-2">
      <span class="material-icons text-xs">error_outline</span>
      {{ errorMessage() }}
    </div>
    }

    <form (submit)="handleSubmit()" class="space-y-4 mb-4">
      <div class="space-y-1 group">
        <label for="email" class="tech-label text-[9px] group-focus-within:text-white transition-colors">Email
          Address</label>
        <div class="relative">
          <span
            class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-xs group-focus-within:text-white transition-colors"
            style="left: 7px;">email</span>
          <input id="email" type="email" [(ngModel)]="email" name="email"
            class="input-field text-xs pl-8 py-2 bg-black/40 border-white/10 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all"
            placeholder="name@example.com" required>
        </div>
      </div>
      <div class="space-y-1 group">
        <label for="password"
          class="tech-label text-[9px] group-focus-within:text-white transition-colors">Password</label>
        <div class="relative">
          <span
            class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-xs group-focus-within:text-white transition-colors"
            style="left: 7px;">lock</span>
          <input id="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password"
            class="input-field text-xs pl-8 pr-10 py-2 bg-black/40 border-white/10 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all"
            placeholder="••••••••" required>
          <button type="button" (click)="showPassword.set(!showPassword())"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-accent-muted hover:text-white transition-colors focus:outline-none">
            <span class="material-icons text-sm">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full py-2 mt-4 bg-white hover:bg-white/90 text-metallic-black text-xs font-bold rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        @if (isLoading()) {
        <span class="animate-spin material-icons text-xs">refresh</span>
        Authenticating...
        } @else {
        Login to Dashboard
        <span class="material-icons text-xs">arrow_forward</span>
        }
      </button>
    </form>

    <div class="flex flex-col gap-3 mt-6 pt-4 border-t border-white/5">
      <a routerLink="/"
        class="w-full py-2 rounded-xl border border-white/10 bg-black/40 hover:bg-white/5 hover:border-white/20 transition-all duration-300 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest text-accent-muted hover:text-white group">
        <span class="material-icons text-sm transition-transform group-hover:-translate-x-1">arrow_back</span>
        Back to Home
      </a>
      
      <p class="text-center text-[10px] text-accent-muted">
        New here?
        <a routerLink="/register"
          class="text-white hover:underline font-bold ml-1">Create an Account</a>
      </p>
    </div>
  </div>
</div>
