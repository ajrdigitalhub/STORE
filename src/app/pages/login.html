<div class="min-h-screen flex items-center justify-center px-6 py-12 bg-metallic-black">
  <div class="glass-card w-full max-w-md p-10">
    <div class="w-16 h-16 bg-accent text-metallic-black rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl font-bold">I</div>
    <h1 class="text-3xl font-bold mb-2 text-center">Welcome Back</h1>
    <p class="text-accent-muted mb-8 text-center text-sm">
      Sign in to manage your orders and custom prints.
    </p>

    <form (submit)="handleSubmit()" class="space-y-4 mb-8">
      <div class="space-y-1">
        <label for="email" class="tech-label text-[10px]">Email Address</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" class="input-field text-sm" placeholder="name@example.com" required>
      </div>
      <div class="space-y-1">
        <label for="password" class="tech-label text-[10px]">Password</label>
        <div class="relative">
          <input 
            id="password" 
            [type]="showPassword() ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            class="input-field text-sm pr-12" 
            placeholder="••••••••" 
            required
          >
          <button 
            type="button" 
            (click)="showPassword.set(!showPassword())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-accent-muted hover:text-accent transition-colors focus:outline-none"
          >
            <span class="material-icons text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>
      
      <button type="submit" [disabled]="isLoading()" class="metallic-button w-full py-3 mt-4 flex items-center justify-center gap-2">
        @if (isLoading()) {
          <span class="animate-spin material-icons text-sm">refresh</span>
          Processing...
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="relative mb-8">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
      <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span class="bg-metallic-black px-4 text-accent-muted">Or continue with</span></div>
    </div>

    <button (click)="loginWithGoogle()" [disabled]="isLoading()" class="w-full py-3 rounded border border-white/10 hover:bg-white/5 transition-colors flex items-center justify-center gap-3 text-sm">
      <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="Google">
      Google Account
    </button>
    
    <p class="text-center mt-8 text-xs text-accent-muted">
      Don't have an account?
      <a routerLink="/register" class="text-accent hover:underline font-bold ml-1">Register</a>
    </p>

    <div class="mt-8 pt-8 border-t border-white/5 text-center">
      <div class="bg-accent/5 rounded-xl p-4 mb-6 border border-accent/10">
        <p class="text-[10px] uppercase tracking-widest text-accent mb-2">Admin Credentials</p>
        <p class="text-xs text-accent-muted">Email: <span class="text-white font-mono">admin@ideazone.com</span></p>
        <p class="text-xs text-accent-muted">Pass: <span class="text-white font-mono">admin123</span></p>
      </div>
      <a routerLink="/" class="text-[10px] uppercase tracking-widest text-accent-muted hover:text-accent transition-colors">Continue as Guest</a>
    </div>
  </div>
</div>
