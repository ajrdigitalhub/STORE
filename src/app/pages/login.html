<div class="min-h-screen flex items-center justify-center px-4 py-2 bg-metallic-black relative overflow-hidden">
  <!-- Background ambient glow -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-green-900/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-3xl animate-pulse"
    style="animation-delay: 2s;"></div>

  <div
    class="glass-card w-full max-w-md p-4 sm:p-5 relative z-10 border-t border-l border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.8)] backdrop-blur-xl transform transition-all duration-500 hover:shadow-[0_0_40px_rgba(74,222,128,0.15)]">

    <!-- Idea Zone 3D Glowing Logo -->
    <div class="relative w-16 h-16 mx-auto mb-2 group" style="perspective: 1000px;">
      <!-- Glowing aura -->
      <div
        class="absolute inset-0 bg-green-500/20 blur-xl rounded-full animate-pulse group-hover:bg-green-400/40 transition-all duration-700">
      </div>

      <!-- 3D Container -->
      <div
        class="w-full h-full relative transition-transform duration-700 ease-out transform-gpu group-hover:rotate-y-12 group-hover:-rotate-x-12"
        style="transform-style: preserve-3d;">
        <!-- Front Face -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-cyan-600/10 backdrop-blur-md rounded-2xl border border-green-400/30 flex items-center justify-center shadow-[0_0_30px_rgba(74,222,128,0.2)]"
          style="transform: translateZ(20px);">
          <div class="text-center transform transition-transform duration-500 group-hover:scale-110">
            <span class="block text-xl font-serif italic text-white tracking-tighter"
              style="text-shadow: 0 0 8px #4ade80, 0 0 16px #22c55e, 0 0 24px #16a34a;">IDEA</span>
            <span class="block text-[8px] font-mono text-cyan-100 tracking-[0.3em] mt-0.5"
              style="text-shadow: 0 0 6px #22d3ee, 0 0 12px #06b6d4;">ZONE</span>
            <span class="absolute -right-3 -top-2 text-[8px] font-black text-purple-100"
              style="text-shadow: 0 0 6px #c084fc, 0 0 12px #a855f7;">3D</span>
          </div>
        </div>
        <!-- Depth layers -->
        <div class="absolute inset-0 bg-green-900/20 rounded-2xl border border-green-800/30"
          style="transform: translateZ(10px);"></div>
        <div class="absolute inset-0 bg-black/50 rounded-2xl border border-white/5" style="transform: translateZ(0px);">
        </div>
      </div>
    </div>

    <h1
      class="text-lg font-display font-bold mb-1 text-center bg-clip-text text-transparent bg-gradient-to-r from-white to-accent-muted">
      Welcome Back</h1>
    <p class="text-accent-muted mb-3 text-center text-[10px] font-light">
      Enter the <span class="text-green-400 font-medium">Idea Zone</span> to manage your 3D prints.
    </p>

    @if (errorMessage()) {
    <div class="mb-2 p-2 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] text-center">
      {{ errorMessage() }}
    </div>
    }

    <form (submit)="handleSubmit()" class="space-y-2 mb-3">
      <div class="space-y-1 group">
        <label for="email" class="tech-label text-[9px] group-focus-within:text-green-400 transition-colors">Email
          Address</label>
        <div class="relative">
          <span
            class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-xs group-focus-within:text-green-400 transition-colors"
            style="left: 7px;">email</span>
          <input id="email" type="email" [(ngModel)]="email" name="email"
            class="input-field text-xs pl-8 py-1.5 bg-black/40 border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 transition-all"
            placeholder="name@example.com" required>
        </div>
      </div>
      <div class="space-y-1 group">
        <label for="password"
          class="tech-label text-[9px] group-focus-within:text-green-400 transition-colors">Password</label>
        <div class="relative">
          <span
            class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-accent-muted text-xs group-focus-within:text-green-400 transition-colors"
            style="left: 7px;">lock</span>
          <input id="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password"
            class="input-field text-xs pl-8 pr-10 py-1.5 bg-black/40 border-white/10 focus:border-green-500/50 focus:ring-1 focus:ring-green-500/50 transition-all"
            placeholder="••••••••" required>
          <button type="button" (click)="showPassword.set(!showPassword())"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-accent-muted hover:text-green-400 transition-colors focus:outline-none">
            <span class="material-icons text-sm">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full py-1.5 mt-2 bg-gradient-to-r from-green-600 to-cyan-600 hover:from-green-500 hover:to-cyan-500 text-white text-xs font-semibold rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(74,222,128,0.3)] hover:shadow-[0_0_25px_rgba(74,222,128,0.5)] flex items-center justify-center gap-2">
        @if (isLoading()) {
        <span class="animate-spin material-icons text-xs">refresh</span>
        Authenticating...
        } @else {
        Initialize Session
        <span class="material-icons text-xs">arrow_forward</span>
        }
      </button>
    </form>

    <div class="relative mb-3">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-white/10"></div>
      </div>
      <div class="relative flex justify-center text-[9px] uppercase tracking-widest"><span
          class="bg-metallic-gray/50 px-3 text-accent-muted backdrop-blur-md rounded-full">Or connect via</span></div>
    </div>

    <!-- <button (click)="loginWithGoogle()" [disabled]="isLoading()"

      Google Authorization

      New to Idea Zone?
      <a routerLink="/register"
        class="text-green-400 hover:text-green-300 hover:underline font-bold ml-1 transition-colors">Create Account</a>
    </p>

</div>
