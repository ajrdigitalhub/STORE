<div class="max-w-7xl mx-auto px-6 py-12">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
    <div>
      <h1 class="text-4xl font-bold mb-2">Shop All Products</h1>
      <p class="text-accent-muted">Browse our full collection of 3D printed precision components.</p>
    </div>

    <div class="flex flex-wrap gap-4 w-full md:w-auto">
      <div class="relative flex-grow md:flex-grow-0">
        <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-accent-muted">search</span>
        <input 
          type="text" 
          [formControl]="searchControl" 
          placeholder="Search products..." 
          class="input-field pl-12 py-2"
        >
      </div>
      <select [formControl]="categoryControl" class="input-field py-2 w-full md:w-48">
        <option value="">All Categories</option>
        @for (cat of productService.categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
      <select [formControl]="sortControl" class="input-field py-2 w-full md:w-48">
        <option value="name">Sort by Name</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card [product]="product"></app-product-card>
    } @empty {
      <div class="col-span-full py-24 text-center">
        <span class="material-icons text-6xl text-accent-muted mb-4">inventory_2</span>
        <h3 class="text-2xl font-bold mb-2">No products found</h3>
        <p class="text-accent-muted">Try adjusting your search or category filters.</p>
        <button (click)="searchControl.setValue(''); categoryControl.setValue('')" class="metallic-button mt-6">Clear All Filters</button>
      </div>
    }
  </div>
</div>
